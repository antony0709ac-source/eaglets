<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#231f20" />
<title>Time Tracking Eaglets Volley Aarau</title>
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Time Tracking Eaglets Volley Aarau - Einzeldatei-Version
   Farben aus dem Logo gemessen: #231F20, #D43C2B, #FFFFFF
   ============================================================ */
:root{
  --ink:#231f20; --ink-2:#332e2f; --red:#d43c2b; --red-dark:#a82d1f;
  --paper:#ffffff; --line:#e3e1e1; --mute:#6e6a6b; --wash:#f6f5f5;
  --tap:48px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:"Barlow Condensed",system-ui,sans-serif; font-weight:700; letter-spacing:.01em; margin:0}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.hide{display:none !important}

/* ---------- Layout ---------- */
.wrap{max-width:620px; margin:0 auto; padding:0 14px 90px}
.topbar{background:var(--ink); color:var(--paper); padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:620px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 14px}
.topbar img{height:42px; width:auto; display:block}
.pwdot{width:8px; height:8px; border-radius:50%; background:var(--red); flex:none}
.topbar .who{margin-left:auto; font-size:13px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:35%}
.rule{height:3px; background:var(--red)}
.tabs{display:flex; gap:0; background:var(--ink)}
.tabs-in{max-width:620px; margin:0 auto; display:flex; width:100%}
.tabs button{
  flex:1; background:none; border:0; border-bottom:3px solid transparent;
  color:rgba(255,255,255,.6); padding:11px 6px; font-family:"Barlow Condensed",sans-serif;
  font-size:18px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
}
.tabs button[aria-selected="true"]{color:#fff; border-bottom-color:var(--red)}

/* ---------- Login ---------- */
.login{min-height:100dvh; background:var(--ink); color:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:32px 22px}
.login-in{width:100%; max-width:330px; margin:0 auto}
.login img{width:100%; max-width:270px; height:auto; display:block; margin-bottom:26px}
.login h1{font-size:38px; line-height:.95}
.login .sub{font-family:"Barlow Condensed",sans-serif; font-size:19px; opacity:.65; margin-bottom:28px}
.login label{display:block; font-size:13px; opacity:.7; margin:0 0 5px}
.login input{
  width:100%; min-height:var(--tap); background:transparent; color:#fff;
  border:1px solid rgba(255,255,255,.3); padding:0 12px; margin-bottom:16px; border-radius:0;
}
.login input:focus{border-color:var(--red); outline:none}
.login .note{font-size:13px; opacity:.45; margin-top:26px}

/* ---------- Bausteine ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:0 18px; border:1px solid var(--line); background:var(--paper);
  font-family:"Barlow Condensed",sans-serif; font-size:18px; font-weight:600; letter-spacing:.02em;
}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff}
.btn.primary:hover{background:var(--red-dark); border-color:var(--red-dark)}
.btn.dark{background:var(--ink); border-color:var(--ink); color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45; cursor:default}
.btn.sm{min-height:38px; font-size:16px; padding:0 12px}
.icb{min-width:44px; min-height:38px; padding:0 10px}

.navrow{display:flex; align-items:center; gap:8px; margin:14px 0 10px}
.navrow h2{font-size:23px; flex:1; min-width:0}
.seg{display:flex; border:1px solid var(--line)}
.seg button{background:var(--paper); border:0; padding:0 14px; min-height:38px; font-family:"Barlow Condensed",sans-serif; font-size:17px; font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}

.total{display:flex; justify-content:space-between; align-items:baseline; border-top:2px solid var(--ink); padding:10px 2px 0; margin-top:12px}
.total .n{font-family:"Barlow Condensed",sans-serif; font-size:24px; font-weight:700}
.muted{color:var(--mute)}
.small{font-size:13px}
.msg{padding:9px 12px; border-left:3px solid var(--red); background:var(--wash); font-size:14px; margin:10px 0}
.msg.ok{border-left-color:var(--ink)}

/* ---------- Wochenliste ---------- */
.daylist{border-top:1px solid var(--line)}
.dayrow{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--paper); border:0; border-bottom:1px solid var(--line);
  padding:11px 4px; min-height:var(--tap);
}
.dayrow.we{background:var(--wash)}
.dayrow.today .dd{color:var(--red)}
.dayrow .dd{font-family:"Barlow Condensed",sans-serif; font-size:19px; font-weight:600; width:76px; flex:none}
.dayrow .dd small{display:block; font-size:12px; font-weight:500; opacity:.6; letter-spacing:.03em}
.dayrow .lb{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dayrow .lb .cm{display:block; font-size:13px; color:var(--mute); overflow:hidden; text-overflow:ellipsis}
.dayrow .empty{color:var(--mute); font-size:14px}

/* ---------- Kalender ---------- */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.cal .hd{text-align:center; font-family:"Barlow Condensed",sans-serif; font-size:13px; font-weight:600; color:var(--mute); text-transform:uppercase; padding-bottom:3px}
.cell{
  aspect-ratio:1/1.06; border:1px solid var(--line); background:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:2px; position:relative;
}
.cell.we{background:var(--wash)}
.cell.out{opacity:.3}
.cell.today{border-color:var(--red); border-width:2px}
.cell .n{font-family:"Barlow Condensed",sans-serif; font-size:15px; font-weight:600; line-height:1}
.cell .cdot{position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--red)}

/* ---------- Glyphe: Quadrat mit Fuellgrad ---------- */
.gl{width:20px; height:20px; flex:none; display:block}

/* ---------- Auswahl der Tagesanteile ---------- */
.picker{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.picker button{
  display:flex; align-items:center; gap:9px; min-height:52px; padding:0 12px;
  border:1px solid var(--line); background:var(--paper);
  font-family:"Barlow Condensed",sans-serif; font-size:18px; font-weight:600;
}
.picker button:last-child{grid-column:1/-1}
.picker button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}

/* ---------- Modal / Sheet ---------- */
.ov{position:fixed; inset:0; background:rgba(35,31,32,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.sheet{
  background:var(--paper); width:100%; max-width:620px; max-height:92dvh; overflow-y:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
}
@media (min-width:640px){ .ov{align-items:center} .sheet{max-height:86dvh} }
.sheet h3{font-size:24px}
.sheet .fld{margin:14px 0 0}
.sheet label{display:block; font-size:13px; color:var(--mute); margin-bottom:5px}
.sheet input[type=date],.sheet input[type=password],.sheet input[type=email],.sheet input[type=text],.sheet textarea,.sheet select{
  width:100%; min-height:var(--tap); border:1px solid var(--line); background:var(--paper);
  padding:10px 12px; border-radius:0;
}
.sheet textarea{min-height:78px; resize:vertical}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--ink); outline:none}
.chk{display:flex; align-items:center; gap:10px; min-height:var(--tap); font-size:15px}
.chk input{width:22px; height:22px; accent-color:var(--red)}
.acts{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap}
.acts .btn{flex:1; min-width:130px}

/* ---------- Chips (Mitarbeiterwahl Admin) ---------- */
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch}
.chips button{
  white-space:nowrap; border:1px solid var(--line); background:var(--paper); min-height:40px;
  padding:0 14px; font-family:"Barlow Condensed",sans-serif; font-size:17px; font-weight:600;
}
.chips button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}

/* ---------- Admin Liste ---------- */
.plist{border-top:1px solid var(--line)}
.prow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--paper); border:0; border-bottom:1px solid var(--line); padding:13px 4px; min-height:56px}
.prow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .nm small{display:block; font-size:13px; color:var(--mute)}
.prow .tv{font-family:"Barlow Condensed",sans-serif; font-size:21px; font-weight:700}
.live{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--mute); white-space:nowrap}
.live i{width:8px; height:8px; border-radius:50%; background:var(--mute); display:block}
.live.on i{background:var(--red)}
.cmlist{border-top:1px solid var(--line); margin-top:6px}
.cmlist div{border-bottom:1px solid var(--line); padding:9px 2px; font-size:15px}
.cmlist div b{font-family:"Barlow Condensed",sans-serif; font-weight:600; margin-right:8px}
.legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; font-size:13px; color:var(--mute)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.center{text-align:center; padding:34px 10px; color:var(--mute)}
.cfgerr{max-width:520px; margin:60px auto; padding:0 20px; font-size:15px}
.cfgerr code{background:var(--wash); padding:2px 5px}
.warn{position:fixed; inset:0; background:rgba(35,31,32,.75); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px}
.warn .bx{background:var(--paper); max-width:340px; width:100%; padding:20px}
.warn h3{font-size:22px}
.warn .cd{font-family:"Barlow Condensed",sans-serif; font-size:44px; font-weight:700; color:var(--red); line-height:1}
.mlist{border-top:1px solid var(--line); margin-top:6px}
.mlist button{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--paper); border:0; border-bottom:1px solid var(--line); padding:12px 4px; min-height:var(--tap)}
.mlist button .d{font-family:"Barlow Condensed",sans-serif; font-size:18px; font-weight:600; flex:1}
.mlist button .go{color:var(--red); font-size:20px}
.bar{display:flex; align-items:center; gap:10px; background:var(--ink); color:#fff; padding:10px 12px; margin:12px 0}
.bar .t{flex:1; font-size:14px}
.bar button{background:var(--red); border:0; color:#fff; min-height:36px; padding:0 12px; font-family:"Barlow Condensed",sans-serif; font-size:16px; font-weight:600}
</style>
</head>
<body>

<div id="app"><div class="center">Loading …</div></div>
<div id="modal"></div>
<div id="warnhost"></div>

<script type="module">
/* ============================================================
   KONFIGURATION - nur diese zwei Zeilen anpassen
   Werte in Supabase unter Project Settings -> API Keys
   Beide Werte sind oeffentlich; der Datenschutz kommt aus den
   RLS-Policies in der Datenbank.
   ============================================================ */
const SUPABASE_URL = 'https://uwwpvvteozkompyypnpv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3d3B2dnRlb3prb21weXlwbnB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc5ODMsImV4cCI6MjEwMzgyMzk4M30.YTtoD8boXR6vr0V6fo1CGj_vrrerT0ly4Cm0ZUGCjaA';

/* ---- Einstellungen: bei Bedarf hier anpassen ---- */
const REMIND_DAYS_BACK     = 14;    // wie weit die Erinnerung zurueckschaut
const REMIND_WEEKDAYS_ONLY = true;  // Sa/So nicht anmahnen
const IDLE_MINUTES         = 30;    // Abmeldung nach Inaktivitaet
const IDLE_WARN_SECONDS    = 60;    // Vorwarnung davor
const MIN_PASSWORD_LENGTH  = 8;

/* Meldungen, wenn die Datenbank einen Schreibzugriff stillschweigend
   verwirft. Das passiert, wenn die passende RLS-Policy fehlt. */
const NO_DELETE = 'Nothing was deleted. The database is refusing it — the delete policy is missing.';
const NO_WRITE  = 'Nothing was saved. The database is refusing it — check the write policy.';

/* ============================================================ */

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const app = document.getElementById('app');
const modalHost = document.getElementById('modal');
const warnHost = document.getElementById('warnhost');

if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('PASTE')) {
  app.innerHTML = `<div class="cfgerr"><h2>Configuration missing</h2>
    <p>Open this file in a text editor and replace
    <code>PASTE_YOUR_ANON_KEY_HERE</code> with the anon key from
    Supabase (Project Settings &rarr; API Keys).</p></div>`;
  throw new Error('anon key missing');
}

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- Tagesanteile: Keys = Postgres-Enum entry_amount ---------- */
const AMOUNTS = [
  { key:'quarter',       label:'1/4 day',  f:0.25 },
  { key:'half',          label:'1/2 day',  f:0.5  },
  { key:'three_quarter', label:'3/4 day',  f:0.75 },
  { key:'full',          label:'Full day', f:1    },
  { key:'day_off',       label:'Day off',  f:0    },
];
const AM = Object.fromEntries(AMOUNTS.map(a => [a.key, a]));

/* ---------- Datum: durchgehend lokale Zeitzone ---------- */
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MO = ['January','February','March','April','May','June','July',
            'August','September','October','November','December'];

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addD = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addD(d, -((d.getDay()+6)%7));
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const addM = (d,n) => new Date(d.getFullYear(), d.getMonth()+n, 1);
const monthEnd = d => new Date(d.getFullYear(), d.getMonth()+1, 0);
const wdIdx = s => (parse(s).getDay()+6)%7;
const wdName = s => WD[wdIdx(s)];
const isWE = s => wdIdx(s) >= 5;
const dayNum = s => Number(s.slice(8));
const fmtLong = s => { const d = parse(s); return `${WD[wdIdx(s)]} ${d.getDate()} ${MO[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MO[d.getMonth()].slice(0,3)}`; };
const days = (a,b) => { const out = []; let c = parse(a); const e = parse(b); while (c <= e) { out.push(iso(c)); c = addD(c,1); } return out; };
const nDays = n => `${Math.round(n*100)/100} ${n === 1 ? 'day' : 'days'}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Glyphe: Quadrat, Fuellhoehe = Tagesanteil ---------- */
function glyph(key, light = false) {
  const stroke = light ? '#fff' : '#231f20';
  const fill = light ? '#fff' : 'var(--red)';
  const a = key ? AM[key] : null;
  if (!a) return `<svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" fill="none" stroke="${stroke}" stroke-opacity=".3" stroke-width="1.6"/></svg>`;
  const off = key === 'day_off';
  const h = 21 * a.f;
  return `<svg class="gl" viewBox="0 0 24 24" role="img" aria-label="${a.label}">
    ${(!off && a.f > 0) ? `<rect x="1.5" y="${1.5 + 21 - h}" width="21" height="${h}" fill="${fill}"/>` : ''}
    <rect x="1.5" y="1.5" width="21" height="21" fill="none" stroke="${stroke}" stroke-width="1.6"/>
    ${off ? `<line x1="3" y1="21" x2="21" y2="3" stroke="${stroke}" stroke-width="1.6"/>` : ''}
  </svg>`;
}

/* ============================================================
   Zustand
   ============================================================ */
const S = {
  session:null, profile:null, people:[],
  tab:'mine',                 // 'mine' | 'admin'
  mode:'week',                // Mitarbeiteransicht
  anchor:new Date(),          // Bezugsdatum fuer Wochen-/Monatsnavigation
  entries:{},                 // eigene Eintraege: iso -> row
  aMonth:monthStart(new Date()),
  aPerson:'all',
  aRows:[],
  live:'connecting',
  flash:null,
  missing:[],          // vergessene Tage
};
let channel = null;
let logoutNotice = null;   // Hinweis auf dem Login nach Zwangsabmeldung
let afterClose = null;     // laeuft, wenn ein Dialog geschlossen wird

function flash(text, kind = 'ok') { S.flash = { text, kind }; render(); setTimeout(() => { S.flash = null; render(); }, 4000); }

/* ============================================================
   Datenzugriff
   ============================================================ */
async function loadMine() {
  const from = S.mode === 'week' ? iso(mondayOf(S.anchor)) : iso(monthStart(S.anchor));
  const to   = S.mode === 'week' ? iso(addD(mondayOf(S.anchor),6)) : iso(monthEnd(S.anchor));
  const { data, error } = await sb.from('time_entries')
    .select('id,entry_date,amount,comment').eq('user_id', S.session.user.id)
    .gte('entry_date', from).lte('entry_date', to);
  if (error) return flash('Could not load entries: ' + error.message, 'err');
  S.entries = Object.fromEntries((data ?? []).map(r => [r.entry_date, r]));
  render();
}

async function loadPeople() {
  const { data, error } = await sb.from('profiles').select('id,full_name,role,active').order('full_name');
  if (!error) S.people = (data ?? []).filter(p => p.active);
}

async function loadAdmin() {
  const from = iso(S.aMonth), to = iso(monthEnd(S.aMonth));
  const { data, error } = await sb.from('time_entries')
    .select('id,user_id,entry_date,amount,comment').gte('entry_date', from).lte('entry_date', to);
  if (error) return flash('Could not load entries: ' + error.message, 'err');
  S.aRows = data ?? [];
  render();
}

function subscribe() {
  if (channel) return;
  channel = sb.channel('entries-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'time_entries' }, () => {
      if (S.tab === 'admin') loadAdmin(); else loadMine();
    })
    .subscribe(st => {
      S.live = st === 'SUBSCRIBED' ? 'live'
             : (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') ? 'disconnected' : 'connecting';
      render();
    });
}

/* ============================================================
   Schreiben
   ============================================================ */
/* Alle Schreibzugriffe nehmen den Zielbenutzer als Parameter. Ohne Angabe
   ist es der angemeldete Benutzer. Fremde Benutzer darf nur ein Admin
   schreiben - durchgesetzt wird das in den RLS-Policies, nicht hier.

   Wichtig: sperrt eine RLS-Policy den Zugriff, liefert Postgres bei
   DELETE und UPDATE keinen Fehler, sondern null betroffene Zeilen. Ohne
   .select() sieht der Client einen Erfolg, obwohl nichts passiert ist -
   genau das war die Ursache des stummen Loeschens. Darum pruefen wir
   ueberall die zurueckgegebenen Zeilen. */

const myId = () => S.session.user.id;

async function saveOne(date, amount, comment, userId = myId()) {
  const { data, error } = await sb.from('time_entries').upsert(
    { user_id:userId, entry_date:date, amount, comment: comment?.trim() || null },
    { onConflict:'user_id,entry_date' }).select('id');
  if (error) { flash('Not saved: ' + error.message, 'err'); return false; }
  if (!data?.length) { flash(NO_WRITE, 'err'); return false; }
  return true;
}

async function saveRange(from, to, amount, comment, skipWeekends, userId = myId()) {
  let list = days(from, to);
  if (skipWeekends) list = list.filter(d => !isWE(d));
  if (!list.length) { flash('No days in that range.', 'err'); return false; }
  const rows = list.map(d => ({
    user_id:userId, entry_date:d, amount, comment: comment?.trim() || null,
  }));
  const { data, error } = await sb.from('time_entries')
    .upsert(rows, { onConflict:'user_id,entry_date' }).select('id');
  if (error) { flash('Not saved: ' + error.message, 'err'); return false; }
  if (!data?.length) { flash(NO_WRITE, 'err'); return false; }
  flash(`Saved ${data.length} ${data.length === 1 ? 'day' : 'days'}.`);
  return true;
}

async function deleteOne(date, userId = myId()) {
  const { data, error } = await sb.from('time_entries').delete()
    .eq('user_id', userId).eq('entry_date', date).select('id');
  if (error) { flash('Not deleted: ' + error.message, 'err'); return false; }
  if (!data?.length) { flash(NO_DELETE, 'err'); return false; }
  return true;
}

/* ============================================================
   CSV-Export
   Semikolon als Trennzeichen und BOM, damit Excel (DE/CH) die
   Datei ohne Importdialog korrekt oeffnet.
   ============================================================ */
function exportCSV() {
  const names = Object.fromEntries(S.people.map(p => [p.id, p.full_name]));
  const rows = S.aRows
    .filter(r => S.aPerson === 'all' || r.user_id === S.aPerson)
    .sort((a,b) => a.entry_date.localeCompare(b.entry_date) ||
                   (names[a.user_id] ?? '').localeCompare(names[b.user_id] ?? ''));
  if (!rows.length) { flash('Nothing to export for this month.', 'err'); return; }

  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const lines = [['Date','Weekday','Employee','Amount','Days','Comment'].join(';')];
  for (const r of rows) {
    lines.push([
      q(r.entry_date), q(wdName(r.entry_date)), q(names[r.user_id] ?? r.user_id),
      q(AM[r.amount]?.label ?? r.amount), q(String(AM[r.amount]?.f ?? 0).replace('.',',')), q(r.comment),
    ].join(';'));
  }
  const total = rows.reduce((s,r) => s + (AM[r.amount]?.f ?? 0), 0);
  lines.push(['','','','TOTAL', q(String(Math.round(total*100)/100).replace('.',',')), ''].join(';'));

  const who = S.aPerson === 'all' ? 'all' : (names[S.aPerson] ?? 'employee').toLowerCase().replace(/\s+/g,'-');
  const name = `timetracking-${S.aMonth.getFullYear()}-${String(S.aMonth.getMonth()+1).padStart(2,'0')}-${who}.csv`;
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

    ? (S.aRows.find(r => r.user_id === userId && r.entry_date === date) ?? null)
    : (S.entries[date] ?? null);

  modalHost.innerHTML = `
    <div class="ov" data-close="1"><div class="sheet" role="dialog" aria-modal="true">

      </div>
    </div></div>`;
  const pk = modalHost.querySelector('#pk');
  const paint = () => {
    pk.innerHTML = AMOUNTS.map(a =>
      `<button type="button" data-k="${a.key}" aria-pressed="${amount === a.key}">
         ${glyph(a.key, amount === a.key)}<span>${a.label}</span></button>`).join('');
  };

    const b = e.target.closest('button[data-k]'); if (!b) return;
    amount = amount === b.dataset.k ? null : b.dataset.k; paint();
  };
  const reload = () => other ? loadAdmin() : loadMine();

    if (!amount) return flash('Please choose an amount.', 'err');

      flash(`Saved ${fmtShort(date)}${other ? ` for ${esc(who.split(' ')[0])}` : ''}.`);

    e.target.disabled = true;

    } else e.target.disabled = false;

function openRange(opts = {}) {
  const t = today();
  const userId = opts.userId ?? myId();

  const who = other ? (S.people.find(p => p.id === userId)?.full_name ?? '') : '';

      <div class="fld"><label for="f2">To</label><input type="date" id="f2" value="${t}"></div>
      <div class="fld"><label>Amount</label><div class="picker" id="pk"></div></div>
      <div class="fld"><label class="chk"><input type="checkbox" id="sw" checked><span>Skip Saturdays and Sundays</span></label></div>

        <button class="btn" data-close="1">Cancel</button>
      </div>
    </div></div>`;
  const $ = s => modalHost.querySelector(s);
  const pk = $('#pk');
  const paint = () => {
    pk.innerHTML = AMOUNTS.map(a =>
      `<button type="button" data-k="${a.key}" aria-pressed="${amount === a.key}">
         ${glyph(a.key, amount === a.key)}<span>${a.label}</span></button>`).join('');
  };
  const preview = () => {
    const f = $('#f1').value, e = $('#f2').value;
    if (!f || !e || f > e) { $('#pv').textContent = 'The end date must not be before the start date.'; return; }
    let l = days(f, e); if ($('#sw').checked) l = l.filter(d => !isWE(d));
    $('#pv').textContent = `${l.length} ${l.length === 1 ? 'day' : 'days'} will be written.`;
  };

    if (days(f, e).length > 200) return flash('Range too long — please split it up.', 'err');

    if (await saveRange(f, e, amount, $('#cm').value, $('#sw').checked, userId)) {
      closeModal();
      if (other) loadAdmin(); else { loadMine(); checkMissing().then(render); }
    } else ev.target.disabled = false;
  };

// Gemeinsame Absendelogik; onDone laeuft nach erfolgreichem Speichern.
function wirePasswordForm(root, onDone) {
  const $ = q => root.querySelector(q);
  const err = t => { const e = $('#pe'); e.textContent = t; e.classList.remove('hide'); };
  $('#pwf').onsubmit = async ev => {
    ev.preventDefault();
    const a = $('#p1').value, b = $('#p2').value;
    if (a.length < MIN_PASSWORD_LENGTH) return err(`Please use at least ${MIN_PASSWORD_LENGTH} characters.`);
    if (a !== b) return err('The two passwords do not match.');
    $('#pws').disabled = true;
    const { error } = await sb.auth.updateUser({ password:a, data:{ password_set:true } });
    if (error) { $('#pws').disabled = false; return err(error.message); }
    // Metadaten lokal nachziehen, damit der Hinweis sofort verschwindet.
    if (S.session?.user) S.session.user.user_metadata = { ...(S.session.user.user_metadata ?? {}), password_set:true };
    afterClose = null;   // Rueckruf hier selbst ausloesen, nicht doppelt
    closeModal();
    flash('Password saved.');
    render();
    if (onDone) onDone();
  };
}

function remindKey() { return `tt:remind:${S.session?.user?.id}:${today()}`; }
function remindDismissed() { try { return localStorage.getItem(remindKey()) === '1'; } catch { return false; } }
function dismissRemind() { try { localStorage.setItem(remindKey(), '1'); } catch {} }

async function checkMissing() {
  S.missing = [];
  const from = iso(addD(new Date(), -REMIND_DAYS_BACK));
  const to = iso(addD(new Date(), -1));
  if (from > to) return;
  const [{ data:have, error:e1 }, { data:first, error:e2 }] = await Promise.all([
    sb.from('time_entries').select('entry_date').gte('entry_date', from).lte('entry_date', to),
    sb.from('time_entries').select('entry_date').order('entry_date', { ascending:true }).limit(1),
  ]);
  if (e1 || e2) return;
  // Ohne jeden Eintrag wird nicht gemahnt: neue Konten sollen keine
  // Rueckstaende aus der Zeit vor ihrem Start angezeigt bekommen.
  const start = first?.[0]?.entry_date;
  if (!start) return;
  const done = new Set((have ?? []).map(r => r.entry_date));
  let list = days(from, to).filter(d => !done.has(d) && d >= start);
  if (REMIND_WEEKDAYS_ONLY) list = list.filter(d => !isWE(d));
  S.missing = list;
}

function openReminder() {
  if (!S.missing.length) { closeModal(); return; }
  const n = S.missing.length;
  modalHost.innerHTML = `
    <div class="ov" data-close="1"><div class="sheet" role="dialog" aria-modal="true">

      <div class="mlist">${S.missing.map(d =>

        <button class="btn" id="later">Remind me tomorrow</button>
        <button class="btn dark" data-close="1">Close</button>
      </div>

  modalHost.querySelectorAll('[data-day]').forEach(b =>
    b.onclick = () => openDay(b.dataset.day, { fromReminder:true }));
  modalHost.querySelector('#later').onclick = () => { dismissRemind(); closeModal(); };
}

/* ============================================================
   Abmeldung bei Inaktivitaet
   ============================================================ */
let lastAct = Date.now(), idleTimer = null, cdTimer = null, warning = false;
const ACT_EVENTS = ['pointerdown','keydown','touchstart','scroll'];

function touchAct() {
  lastAct = Date.now();
  if (warning) { warning = false; clearInterval(cdTimer); warnHost.innerHTML = ''; }
}

function startIdle() {
  stopIdle();
  lastAct = Date.now();
  ACT_EVENTS.forEach(e => window.addEventListener(e, touchAct, { passive:true }));
  document.addEventListener('visibilitychange', onVis);
  idleTimer = setInterval(idleTick, 5000);
}

function stopIdle() {
  ACT_EVENTS.forEach(e => window.removeEventListener(e, touchAct));
  document.removeEventListener('visibilitychange', onVis);
  if (idleTimer) clearInterval(idleTimer);
  if (cdTimer) clearInterval(cdTimer);
  idleTimer = cdTimer = null; warning = false; warnHost.innerHTML = '';
}

// Timer stehen still, wenn das Handy schlaeft. Beim Zurueckkehren wird
// deshalb ueber den Zeitstempel geprueft, nicht ueber den Timer.
function onVis() { if (!document.hidden) idleTick(); }

function idleTick() {
  if (!S.session) return;
  const limit = IDLE_MINUTES * 60000;
  const idle = Date.now() - lastAct;
  if (idle >= limit) return idleLogout();
  if (!warning && idle >= limit - IDLE_WARN_SECONDS * 1000) showIdleWarn();
}

function showIdleWarn() {
  warning = true;
  const limit = IDLE_MINUTES * 60000;
  const paint = () => {
    const left = Math.max(0, Math.ceil((limit - (Date.now() - lastAct)) / 1000));
    warnHost.innerHTML = `<div class="warn"><div class="bx" role="alertdialog" aria-modal="true">
      <h3>Still there?</h3>
      <p class="small muted">You will be signed out automatically for security.</p>
      <p class="cd">${left}s</p>
      <button class="btn primary wide" id="stay" style="margin-top:14px">Stay signed in</button>
    </div></div>`;
    const b = warnHost.querySelector('#stay');
    if (b) b.onclick = touchAct;
    if (left <= 0) idleLogout();
  };
  paint();
  clearInterval(cdTimer);
  cdTimer = setInterval(paint, 1000);
}

function idleLogout() {
  stopIdle();
  logoutNotice = `Signed out after ${IDLE_MINUTES} minutes without activity.`;
  closeModal();
  sb.auth.signOut();
}

async function doSignOut() {
  stopIdle();
  closeModal();
  try { await sb.auth.signOut({ scope:'local' }); } catch {}
  S.session = null; S.profile = null;

}

/* ---------- Mitarbeiteransicht ---------- */
function mineHTML() {
  const week = S.mode === 'week';
  const mon = mondayOf(S.anchor);
  const list = week ? days(iso(mon), iso(addD(mon,6))) : days(iso(monthStart(S.anchor)), iso(monthEnd(S.anchor)));
  const total = list.reduce((s,d) => s + (AM[S.entries[d]?.amount]?.f ?? 0), 0);
  const title = week
    ? `${fmtShort(iso(mon))} – ${fmtShort(iso(addD(mon,6)))} ${addD(mon,6).getFullYear()}`
    : `${MO[S.anchor.getMonth()]} ${S.anchor.getFullYear()}`;

  const bar = S.missing.length ? `<div class="bar">
      <span class="t">${S.missing.length} ${S.missing.length === 1 ? 'day' : 'days'} without an entry</span>
      <button id="remopen">Review</button></div>` : '';

  return `${bar}
    <div class="seg" style="margin-top:14px" role="group" aria-label="View">
      <button data-mode="week" aria-pressed="${week}" style="flex:1">Week</button>
      <button data-mode="month" aria-pressed="${!week}" style="flex:1">Month</button>
    </div>
    <div class="navrow">
      <button class="btn sm icb" data-nav="-1" aria-label="Previous">‹</button>
      <h2>${title}</h2>
      <button class="btn sm" data-nav="0">Today</button>
      <button class="btn sm icb" data-nav="1" aria-label="Next">›</button>
    </div>
    ${week ? weekListHTML(list) : calHTML(list, S.entries, null)}
    <div class="total"><span class="disp" style="font-size:19px">Total</span><span class="n">${nDays(total)}</span></div>
    <button class="btn dark wide" id="rng" style="margin-top:16px">+ Add a period</button>
    <p class="small muted" style="margin-top:8px">Tap any day to enter or change it.</p>`;
}

function weekListHTML(list) {
  const t = today();
  return `<div class="daylist">${list.map(d => {
    const r = S.entries[d];
    return `<button class="dayrow ${isWE(d) ? 'we' : ''} ${d === t ? 'today' : ''}" data-day="${d}">
      <span class="dd">${dayNum(d)} ${MO[parse(d).getMonth()].slice(0,3)}<small>${wdName(d)}</small></span>
      ${glyph(r?.amount)}
      <span class="lb">${r ? `${AM[r.amount].label}${r.comment ? `<span class="cm">${esc(r.comment)}</span>` : ''}`
                          : '<span class="empty">No entry</span>'}</span>
    </button>`;
  }).join('')}</div>`;
}

function calHTML(list, map, userId) {
  const t = today();
  const lead = wdIdx(list[0]);
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="cell out"></div>');
  for (const d of list) {
    const r = userId ? map[`${userId}|${d}`] : map[d];
    cells.push(`<button class="cell ${isWE(d) ? 'we' : ''} ${d === t ? 'today' : ''}" data-day="${d}"
      title="${r ? esc(AM[r.amount].label + (r.comment ? ' – ' + r.comment : '')) : 'No entry'}">
      <span class="n">${dayNum(d)}</span>${glyph(r?.amount)}
      ${r?.comment ? '<span class="cdot"></span>' : ''}</button>`);
  }
  return `<div class="cal">${WD.map(w => `<div class="hd">${w[0]}</div>`).join('')}${cells.join('')}</div>`;
}

function wireMine() {
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; loadMine(); });
  app.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.nav);
    if (n === 0) S.anchor = new Date();
    else S.anchor = S.mode === 'week' ? addD(mondayOf(S.anchor), n*7) : addM(S.anchor, n);
    loadMine();
  });
  const r = document.getElementById('rng'); if (r) r.onclick = () => openRange();
  const ro = document.getElementById('remopen'); if (ro) ro.onclick = openReminder;
  if (S.tab === 'mine') app.querySelectorAll('[data-day]').forEach(b => b.onclick = () => openDay(b.dataset.day));
}

/* ---------- Admin-Dashboard ---------- */
function adminHTML() {
  const names = Object.fromEntries(S.people.map(p => [p.id, p.full_name]));
  const list = days(iso(S.aMonth), iso(monthEnd(S.aMonth)));
  const byKey = {}; for (const r of S.aRows) byKey[`${r.user_id}|${r.entry_date}`] = r;
  const totalOf = id => list.reduce((s,d) => s + (AM[byKey[`${id}|${d}`]?.amount]?.f ?? 0), 0);

  const head = `
    <div class="navrow">
      <button class="btn sm icb" data-anav="-1" aria-label="Previous month">‹</button>
      <h2>${MO[S.aMonth.getMonth()]} ${S.aMonth.getFullYear()}</h2>
      <button class="btn sm" data-anav="0">This month</button>
      <button class="btn sm icb" data-anav="1" aria-label="Next month">›</button>
    </div>
    <div class="chips">
      <button data-p="all" aria-pressed="${S.aPerson === 'all'}">Everyone</button>
      ${S.people.map(p => `<button data-p="${p.id}" aria-pressed="${S.aPerson === p.id}">${esc(p.full_name.split(' ')[0])}</button>`).join('')}
    </div>`;

  let body;
  if (S.aPerson === 'all') {
    const grand = S.aRows.reduce((s,r) => s + (AM[r.amount]?.f ?? 0), 0);
    body = S.people.length ? `<div class="plist">${S.people.map(p => {
      const n = list.filter(d => byKey[`${p.id}|${d}`]).length;
      return `<button class="prow" data-p2="${p.id}">
        <span class="nm">${esc(p.full_name)}<small>${n} ${n === 1 ? 'entry' : 'entries'}${p.role === 'admin' ? ' · admin' : ''}</small></span>
        <span class="tv">${nDays(totalOf(p.id))}</span><span class="muted">›</span></button>`;
    }).join('')}</div>
    <div class="total"><span class="disp" style="font-size:19px">Month total</span><span class="n">${nDays(grand)}</span></div>`
    : '<div class="center">No employees yet.</div>';
  } else {
    const rows = S.aRows.filter(r => r.user_id === S.aPerson)
      .sort((a,b) => a.entry_date.localeCompare(b.entry_date));
    const cm = rows.filter(r => r.comment);
    body = `<h3 class="disp" style="font-size:21px;margin-bottom:8px">${esc(names[S.aPerson] ?? '')}</h3>
      ${calHTML(list, byKey, S.aPerson)}
      <div class="total"><span class="disp" style="font-size:19px">Total</span><span class="n">${nDays(totalOf(S.aPerson))}</span></div>
      <button class="btn dark wide" id="arng" style="margin-top:16px">+ Add a period for this person</button>
      <p class="small muted" style="margin-top:8px">Tap any day to enter, change or delete it.</p>
      <h3 class="disp" style="font-size:19px;margin:20px 0 6px">Entries</h3>
      ${rows.length ? `<div class="cmlist">${rows.map(r =>
        `<div><b>${fmtShort(r.entry_date)}</b>${AM[r.amount].label}${r.comment ? ` <span class="muted">— ${esc(r.comment)}</span>` : ''}</div>`).join('')}</div>`
        : '<p class="muted small">No entries this month.</p>'}`;
  }

  return `${head}${body}
    <button class="btn wide" id="csv" style="margin-top:18px">Export CSV${S.aPerson === 'all' ? '' : ' (this person)'}</button>
    <div class="legend">
      ${AMOUNTS.map(a => `<span>${glyph(a.key)}${a.label}</span>`).join('')}
      <span><i style="width:6px;height:6px;border-radius:50%;background:var(--red);display:block"></i>Comment</span>
      <span class="live ${S.live === 'live' ? 'on' : ''}"><i></i>${S.live === 'live' ? 'Live' : S.live}</span>
    </div>`;
}

function wireAdmin() {
  app.querySelectorAll('[data-anav]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.anav);
    S.aMonth = n === 0 ? monthStart(new Date()) : addM(S.aMonth, n);
    loadAdmin();
  });
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.aPerson = b.dataset.p; render(); });
  app.querySelectorAll('[data-p2]').forEach(b => b.onclick = () => { S.aPerson = b.dataset.p2; render(); });
  const c = document.getElementById('csv'); if (c) c.onclick = exportCSV;

  // Nur der Chef sieht dieses Dashboard ueberhaupt. Von hier aus darf er
  // jeden Tag des gewaehlten Mitarbeiters anlegen, aendern und loeschen.
  if (S.tab === 'admin' && S.aPerson !== 'all' && S.profile?.role === 'admin') {
    const uid = S.aPerson;
    app.querySelectorAll('.cal [data-day]').forEach(b =>
      b.onclick = () => openDay(b.dataset.day, { userId:uid }));
    const ar = document.getElementById('arng');
    if (ar) ar.onclick = () => openRange({ userId:uid });
  }
}

/* ============================================================
   Start
   ============================================================ */
async function boot(session) {
  S.session = session;
  if (!session) { S.profile = null; stopIdle(); render(); return; }
  logoutNotice = null;
  const { data, error } = await sb.from('profiles')
    .select('id,full_name,role').eq('id', session.user.id).single();
  if (error) { flash('Could not load profile: ' + error.message, 'err'); render(); return; }
  S.profile = data;
  render();
  await afterAuth();
}

async function afterAuth() {
  startIdle();
  subscribe();
  await loadMine();
  if (S.profile?.role === 'admin') await loadPeople();
  render();
  await checkMissing();
  render();
  // Reihenfolge: erst der Passworthinweis, danach die Erinnerung an
  // vergessene Tage - sonst wuerde ein Dialog den anderen verdecken.
  const remind = () => { if (S.missing.length && !remindDismissed()) openReminder(); };
  if (needsPassword()) openFirstPassword(remind); else remind();
}

const { data: s0 } = await sb.auth.getSession();
await boot(s0.session);
sb.auth.onAuthStateChange((_e, next) => {
  // Kein await gegen Supabase im Callback: setTimeout entkoppelt den Aufruf.
  setTimeout(() => boot(next), 0);
});
</script>
